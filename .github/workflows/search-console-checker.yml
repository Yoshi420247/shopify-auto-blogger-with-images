# Daily Search Console Checker
# Runs once per day to:
# 1. Analyze Google Search Console trends
# 2. Optimize hyperlinks in trending blog pages
# 3. Write 1 product-targeted blog per week
name: Daily Search Console Checker

on:
  # Run once daily at 8 AM UTC
  schedule:
    - cron: '0 8 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (analyze but do not publish changes)'
        required: false
        default: false
        type: boolean
      force_product_blog:
        description: 'Force write a product-targeted blog (ignores weekly cadence)'
        required: false
        default: false
        type: boolean

jobs:
  search-console-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore research cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: gsc-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gsc-cache-${{ runner.os }}-

      - name: Validate secrets
        run: |
          echo "Validating required secrets..."
          if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is not set"
            echo "This secret should contain the full JSON key of a Google service account"
            echo "with access to your Search Console property."
            exit 1
          fi
          if [ -z "${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}" ]; then
            echo "ERROR: SHOPIFY_ADMIN_API_TOKEN is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "ERROR: OPENAI_API_KEY is not set"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Run Search Console Checker
        env:
          # Google Search Console
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || '' }}

          # Shopify
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}

          # AI APIs
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Behavior controls
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_PRODUCT_BLOG: ${{ github.event.inputs.force_product_blog || 'false' }}
          PRODUCT_BLOG_DAY: '1'
        run: |
          echo "=========================================="
          echo "DAILY SEARCH CONSOLE CHECKER"
          echo "=========================================="
          echo "Dry run: $DRY_RUN"
          echo "Force product blog: $FORCE_PRODUCT_BLOG"
          echo "=========================================="
          node src/searchConsoleChecker.js

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-checker-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 30

  # Notification job
  notify:
    needs: search-console-check
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.search-console-check.result }}" == "success" ]; then
            echo "Search Console checker completed successfully"
          else
            echo "Search Console checker failed or was cancelled"
            exit 1
          fi
