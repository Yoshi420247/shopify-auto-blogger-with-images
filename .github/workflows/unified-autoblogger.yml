# Unified Shopify Auto-Blogger
# Publishes 3 quality blog posts per day + GSC maintenance
#
# Schedule (all times UTC):
#   5 AM  - GSC analysis + link optimization (no new blog)
#   10 AM - Blog 1: GSC-informed (data-driven topic from Search Console)
#   15:00 - Blog 2: Strategic (pillar/cluster gaps, strike-distance keywords)
#   21:00 - Blog 3: Category rotation (auto-picks next category for variety)
name: Unified Auto-Blogger

on:
  schedule:
    # GSC analysis + link optimization only (no new blog)
    - cron: '0 5 * * *'
    # Blog 1: GSC-informed — pick the highest-opportunity topic from search data
    - cron: '0 10 * * *'
    # Blog 2: Strategic — pillar/cluster gaps, strike-distance, content gaps
    - cron: '0 15 * * *'
    # Blog 3: Category rotation — cycle through categories for breadth
    - cron: '0 21 * * *'

  workflow_dispatch:
    inputs:
      strategy:
        description: 'Run strategy'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gsc-analyze
          - gsc-informed
          - category-rotate
          - strategic
          - full-pipeline
      blogs_count:
        description: 'Number of blogs to generate (1-10)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'
      content_category:
        description: 'Content category (for category-rotate strategy)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - dabbing_storage
          - product_spotlight
          - science_education
          - culture_lifestyle
          - comparison_review
          - troubleshooting
          - industry_trends
      content_format:
        description: 'Content format type'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - standard
          - listicle
          - deep_dive
          - quick_guide
          - comparison
          - myth_busting
      mode:
        description: 'Content mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - new
          - update
          - mixed
      ai_model:
        description: 'AI model for content generation'
        required: false
        default: 'claude-sonnet'
        type: choice
        options:
          - claude-sonnet
          - claude-opus
          - gpt-5.2
      image_provider:
        description: 'Image generation provider'
        required: false
        default: 'gemini'
        type: choice
        options:
          - gemini
          - gpt-image-1
      topic:
        description: 'Specific topic to write about (overrides strategy)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (generate but do not publish)'
        required: false
        default: false
        type: boolean

jobs:
  unified-autoblogger:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore research cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: unified-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            unified-cache-${{ runner.os }}-

      - name: Validate secrets
        run: |
          echo "Validating required secrets..."
          MISSING=0
          if [ -z "${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}" ]; then
            echo "ERROR: SHOPIFY_ADMIN_API_TOKEN is not set"
            MISSING=1
          fi
          if [ -z "${{ secrets.SHOPIFY_STORE_DOMAIN }}" ]; then
            echo "ERROR: SHOPIFY_STORE_DOMAIN is not set"
            MISSING=1
          fi
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ERROR: ANTHROPIC_API_KEY is not set (required for default Claude Sonnet model)"
            MISSING=1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "WARNING: GEMINI_API_KEY is not set - images will be skipped"
          fi
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "WARNING: OPENAI_API_KEY is not set - needed if using gpt-5.2 model or gpt-image-1 image provider"
          fi
          if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "WARNING: GOOGLE_SERVICE_ACCOUNT_JSON is not set - GSC features will be skipped"
          fi
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "All required secrets are configured"

          # Validate OpenAI key if GPT model selected
          AI_MODEL="${{ github.event.inputs.ai_model || 'claude-sonnet' }}"
          if [ "$AI_MODEL" = "gpt-5.2" ]; then
            if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
              echo "WARNING: OPENAI_API_KEY not set but GPT model selected, falling back to Claude Sonnet"
            else
              echo "OpenAI API key configured for GPT-5.2"
            fi
          fi

      - name: Determine run strategy from schedule
        id: determine-strategy
        run: |
          # Manual trigger takes precedence
          if [ -n "${{ github.event.inputs.strategy }}" ] && [ "${{ github.event.inputs.strategy }}" != "auto" ]; then
            echo "strategy=${{ github.event.inputs.strategy }}" >> $GITHUB_OUTPUT
            echo "Using manual strategy: ${{ github.event.inputs.strategy }}"
            exit 0
          fi

          # Schedule-based strategy selection — each slot gets a distinct strategy
          HOUR=$(date -u +%H)
          echo "Current UTC hour: $HOUR"

          case "$HOUR" in
            05)
              echo "strategy=gsc-analyze" >> $GITHUB_OUTPUT
              echo "Schedule: 5 AM — GSC analysis + link optimization (no blog)"
              ;;
            10)
              echo "strategy=gsc-informed" >> $GITHUB_OUTPUT
              echo "Schedule: 10 AM — Blog 1: GSC-informed (data-driven topic)"
              ;;
            15)
              echo "strategy=strategic" >> $GITHUB_OUTPUT
              echo "Schedule: 3 PM — Blog 2: Strategic (pillar/cluster/gaps)"
              ;;
            21)
              echo "strategy=category-rotate" >> $GITHUB_OUTPUT
              echo "Schedule: 9 PM — Blog 3: Category rotation (breadth)"
              ;;
            *)
              echo "strategy=auto" >> $GITHUB_OUTPUT
              echo "Schedule: Off-schedule run, using auto strategy"
              ;;
          esac

      - name: Run Unified Auto-Blogger
        env:
          # API Keys
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || '' }}

          # Unified strategy controls
          RUN_STRATEGY: ${{ steps.determine-strategy.outputs.strategy }}
          BLOGS_PER_RUN: ${{ github.event.inputs.blogs_count || '1' }}
          BLOG_MODE: ${{ github.event.inputs.mode || 'auto' }}
          CONTENT_CATEGORY: ${{ github.event.inputs.content_category || 'auto' }}
          CONTENT_FORMAT: ${{ github.event.inputs.content_format || 'auto' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.topic || '' }}
          AI_MODEL: ${{ github.event.inputs.ai_model || 'claude-sonnet' }}
          IMAGE_PROVIDER: ${{ github.event.inputs.image_provider || 'gemini' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PRODUCT_BLOG_DAY: '1'
        run: |
          echo "=========================================="
          echo "UNIFIED AUTO-BLOGGER"
          echo "=========================================="
          echo "Strategy: $RUN_STRATEGY"
          echo "Blogs to generate: $BLOGS_PER_RUN"
          echo "Mode: $BLOG_MODE"
          echo "Content category: $CONTENT_CATEGORY"
          echo "Content format: $CONTENT_FORMAT"
          echo "AI model: $AI_MODEL"
          echo "Image provider: $IMAGE_PROVIDER"
          echo "Dry run: $DRY_RUN"
          if [ -n "$CUSTOM_TOPIC" ]; then
            echo "Custom topic: $CUSTOM_TOPIC"
          fi
          echo "=========================================="
          npm start

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-autoblogger-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 30

  notify:
    needs: unified-autoblogger
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.unified-autoblogger.result }}" == "success" ]; then
            echo "Unified auto-blogger completed successfully"
          else
            echo "Unified auto-blogger failed or was cancelled"
            exit 1
          fi
