name: Repair Blog Images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without writing (recommended first run)'
        required: false
        default: true
        type: boolean

jobs:
  repair-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run image repair script
        env:
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/repair-blog-images.js
