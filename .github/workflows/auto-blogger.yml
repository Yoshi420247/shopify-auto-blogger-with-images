# Shopify Auto-Blogger Workflow
name: Auto-Blogger with AI Images

on:
  # ============ SCHEDULE: 5 BLOGS PER DAY ============
  # Split into two content categories:
  # - Dabbing & Storage: 2 articles/day (6 AM, 10 AM UTC)
  # - What You Need products (bongs, rigs): 3 articles/day (2 PM, 6 PM, 10 PM UTC)
  schedule:
    # Dabbing & Storage content - 6 AM and 10 AM UTC
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    # What You Need products - 2 PM, 6 PM, 10 PM UTC
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      blogs_count:
        description: 'Number of blogs to generate (1-10)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'
      mode:
        description: 'Content mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - new
          - update
          - mixed
      content_category:
        description: 'Content category'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - dabbing_storage
          - what_you_need
      topic:
        description: 'Specific topic to write about (optional, overrides mode)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (generate but do not publish)'
        required: false
        default: false
        type: boolean

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increased for multiple blogs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        run: |
          echo "Validating required secrets..."
          if [ -z "${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}" ]; then
            echo "ERROR: SHOPIFY_ADMIN_API_TOKEN is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SHOPIFY_STORE_DOMAIN }}" ]; then
            echo "ERROR: SHOPIFY_STORE_DOMAIN is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "ERROR: OPENAI_API_KEY is not set"
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "ERROR: GEMINI_API_KEY is not set"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Determine content category from schedule
        id: determine-category
        run: |
          # Get current hour in UTC
          HOUR=$(date -u +%H)
          echo "Current UTC hour: $HOUR"

          # Manual trigger takes precedence
          if [ -n "${{ github.event.inputs.content_category }}" ] && [ "${{ github.event.inputs.content_category }}" != "auto" ]; then
            echo "category=${{ github.event.inputs.content_category }}" >> $GITHUB_OUTPUT
            echo "Using manual category: ${{ github.event.inputs.content_category }}"
          # Schedule-based category selection
          elif [ "$HOUR" = "06" ] || [ "$HOUR" = "10" ]; then
            echo "category=dabbing_storage" >> $GITHUB_OUTPUT
            echo "Schedule-based category: dabbing_storage (Dabbing & Storage)"
          elif [ "$HOUR" = "14" ] || [ "$HOUR" = "18" ] || [ "$HOUR" = "22" ]; then
            echo "category=what_you_need" >> $GITHUB_OUTPUT
            echo "Schedule-based category: what_you_need (Bongs, Rigs & Accessories)"
          else
            echo "category=auto" >> $GITHUB_OUTPUT
            echo "Using auto category selection"
          fi

      - name: Run Auto-Blogger
        env:
          # API Keys from secrets
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Behavior controls (from workflow inputs or defaults)
          BLOGS_PER_RUN: ${{ github.event.inputs.blogs_count || '1' }}
          BLOG_MODE: ${{ github.event.inputs.mode || 'auto' }}
          CONTENT_CATEGORY: ${{ steps.determine-category.outputs.category }}
          CUSTOM_TOPIC: ${{ github.event.inputs.topic || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "=========================================="
          echo "SHOPIFY AUTO-BLOGGER"
          echo "=========================================="
          echo "Blogs to generate: $BLOGS_PER_RUN"
          echo "Mode: $BLOG_MODE"
          echo "Content category: $CONTENT_CATEGORY"
          echo "Dry run: $DRY_RUN"
          if [ -n "$CUSTOM_TOPIC" ]; then
            echo "Custom topic: $CUSTOM_TOPIC"
          fi
          echo "=========================================="
          npm start

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-blogger-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 30

  # Notification job (optional)
  notify:
    needs: generate-blog
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.generate-blog.result }}" == "success" ]; then
            echo "Auto-blogger completed successfully"
          else
            echo "Auto-blogger failed or was cancelled"
            exit 1
          fi
