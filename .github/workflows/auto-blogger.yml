# Shopify Auto-Blogger Workflow
name: Auto-Blogger with AI Images

on:
  # ============ SCHEDULE: 3 BLOGS PER DAY ============
  # Balanced strategy for quality over quantity:
  # - 8 AM UTC:  Dabbing & Storage (guaranteed daily coverage)
  # - 3 PM UTC:  What You Need products (peak US shopping hours)
  # - 10 PM UTC: Auto (AI picks best-value topic from either category)
  schedule:
    # Dabbing & Storage content - 8 AM UTC
    - cron: '0 8 * * *'
    # What You Need products - 3 PM UTC
    - cron: '0 15 * * *'
    # Auto (AI picks best category) - 10 PM UTC
    - cron: '0 22 * * *'

  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      blogs_count:
        description: 'Number of blogs to generate (1-10)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'
      mode:
        description: 'Content mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - new
          - update
          - mixed
      content_category:
        description: 'Content category'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - dabbing_storage
          - what_you_need
      ai_model:
        description: 'AI model for content generation'
        required: false
        default: 'gpt-5.2'
        type: choice
        options:
          - gpt-5.2
          - claude-sonnet
      topic:
        description: 'Specific topic to write about (optional, overrides mode)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (generate but do not publish)'
        required: false
        default: false
        type: boolean

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increased for multiple blogs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore research cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: research-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            research-cache-${{ runner.os }}-

      - name: Validate secrets
        run: |
          echo "Validating required secrets..."
          if [ -z "${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}" ]; then
            echo "ERROR: SHOPIFY_ADMIN_API_TOKEN is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SHOPIFY_STORE_DOMAIN }}" ]; then
            echo "ERROR: SHOPIFY_STORE_DOMAIN is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "ERROR: OPENAI_API_KEY is not set"
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "ERROR: GEMINI_API_KEY is not set"
            exit 1
          fi
          echo "All required secrets are configured"

          # Validate Anthropic key if Claude model selected
          AI_MODEL="${{ github.event.inputs.ai_model || 'gpt-5.2' }}"
          if [ "$AI_MODEL" = "claude-sonnet" ]; then
            if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
              echo "WARNING: ANTHROPIC_API_KEY not set but Claude model selected, falling back to GPT-5.2"
            else
              echo "Anthropic API key configured for Claude Sonnet"
            fi
          fi

      - name: Determine content category from schedule
        id: determine-category
        run: |
          # Get current hour in UTC
          HOUR=$(date -u +%H)
          echo "Current UTC hour: $HOUR"

          # Manual trigger takes precedence
          if [ -n "${{ github.event.inputs.content_category }}" ] && [ "${{ github.event.inputs.content_category }}" != "auto" ]; then
            echo "category=${{ github.event.inputs.content_category }}" >> $GITHUB_OUTPUT
            echo "Using manual category: ${{ github.event.inputs.content_category }}"
          # Schedule-based category selection
          elif [ "$HOUR" = "08" ]; then
            echo "category=dabbing_storage" >> $GITHUB_OUTPUT
            echo "Schedule-based category: dabbing_storage (Dabbing & Storage)"
          elif [ "$HOUR" = "15" ]; then
            echo "category=what_you_need" >> $GITHUB_OUTPUT
            echo "Schedule-based category: what_you_need (Bongs, Rigs & Accessories)"
          elif [ "$HOUR" = "22" ]; then
            echo "category=auto" >> $GITHUB_OUTPUT
            echo "Schedule-based category: auto (AI picks best-value topic)"
          else
            echo "category=auto" >> $GITHUB_OUTPUT
            echo "Using auto category selection"
          fi

      - name: Run Auto-Blogger
        env:
          # API Keys from secrets
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Behavior controls (from workflow inputs or defaults)
          BLOGS_PER_RUN: ${{ github.event.inputs.blogs_count || '1' }}
          BLOG_MODE: ${{ github.event.inputs.mode || 'auto' }}
          CONTENT_CATEGORY: ${{ steps.determine-category.outputs.category }}
          CUSTOM_TOPIC: ${{ github.event.inputs.topic || '' }}
          AI_MODEL: ${{ github.event.inputs.ai_model || 'gpt-5.2' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "=========================================="
          echo "SHOPIFY AUTO-BLOGGER"
          echo "=========================================="
          echo "Blogs to generate: $BLOGS_PER_RUN"
          echo "Mode: $BLOG_MODE"
          echo "Content category: $CONTENT_CATEGORY"
          echo "AI model: $AI_MODEL"
          echo "Dry run: $DRY_RUN"
          if [ -n "$CUSTOM_TOPIC" ]; then
            echo "Custom topic: $CUSTOM_TOPIC"
          fi
          echo "=========================================="
          npm start

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-blogger-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 30

  # Notification job (optional)
  notify:
    needs: generate-blog
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.generate-blog.result }}" == "success" ]; then
            echo "Auto-blogger completed successfully"
          else
            echo "Auto-blogger failed or was cancelled"
            exit 1
          fi
